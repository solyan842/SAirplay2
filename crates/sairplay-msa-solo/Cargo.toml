[package]
name = "sairplay-msa-solo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mdns-sd = "0.21.3"
socket2 = "0.5"
plist = "=1.10.1"
x25519-dalek = "2.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hkdf = "0.12.4"
sha2 = "0.10.9"
rand = "0.8.5"
num-bigint = "0.4.6"
chacha20poly1305 = "0.10.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com"] }
libloading = "0.8"
rubato = "=0.16.2"
