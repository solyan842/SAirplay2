name: Apply strict NTP compatibility

on:
  push:
    branches: [dev/msa-core-architecture]
    paths:
      - ".github/workflows/apply-strict-ntp-compat.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/msa-core-architecture
          fetch-depth: 0

      - name: Apply isolated strict-NTP compatibility path
        run: python scripts/apply_strict_ntp_compat.py

      - name: Verify patch is clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f native/raop-static/strict_clock_shim.c
          test -f native/raop-static/strict_clock_shim.h
          grep -F 'strict_ntp_clock' crates/sairplay-msa-solo/src/windows_raop_session.rs
          grep -F 'sairplay-raop-strict.dll' .github/workflows/windows.yml

      - name: Stage workflow blob without pushing workflow changes
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/windows.yml scripts/generated-windows-strict.yml
          git checkout -- .github/workflows/windows.yml
          git diff --check
          git status --short

      - name: Commit source compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          git fetch origin dev/msa-core-architecture
          if [ "$(git rev-parse origin/dev/msa-core-architecture)" != "$base" ]; then
            echo "Branch moved while compatibility patch was being prepared; refusing to push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/sairplay-msa-solo/src/windows_raop_session.rs \
            crates/sairplay-msa-solo/src/windows_solo_client.rs \
            crates/sairplay-msa-solo/src/windows_raop_worker.rs \
            native/raop-static/strict_clock_shim.c \
            native/raop-static/strict_clock_shim.h \
            scripts/generated-windows-strict.yml
          git commit -m "fix: isolate strict NTP clock for AppleTV3 RAOP"
          git push origin HEAD:dev/msa-core-architecture
