name: Promote MSA Core source

on:
  push:
    branches: [dev/msa-core-architecture]
    paths:
      - ".github/workflows/promote-msa-core-source.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote validated runtime patches into committed source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Apply exactly the already-validated GUI + realtime diagnostic patch
          # set. This changes visibility/layout only; it does not introduce a
          # new AP2 lifecycle/timing/media behavior.
          ./scripts/apply-validated-branch-fixes.ps1

          # The active MSA Core branch must now build the committed source
          # verbatim. Keep the historical patch script available only to the
          # older/full lanes that still depend on it.
          $workflow = ".github/workflows/windows.yml"
          $text = [System.IO.File]::ReadAllText($workflow)
          $old = @'
      - name: Apply validated branch fixes
        shell: pwsh
        run: ./scripts/apply-validated-branch-fixes.ps1
'@
          $new = @'
      - name: Apply validated branch fixes
        if: github.ref != 'refs/heads/dev/msa-core-architecture'
        shell: pwsh
        run: ./scripts/apply-validated-branch-fixes.ps1
'@
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "windows.yml: expected one runtime-patch step, found $count"
          }
          [System.IO.File]::WriteAllText(
            $workflow,
            $text.Replace($old, $new),
            [System.Text.UTF8Encoding]::new($false)
          )

          # One-shot migration workflow: remove itself in the source-alignment
          # commit so it cannot become permanent project baggage.
          git rm ".github/workflows/promote-msa-core-source.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add `
            "crates/sairplay-gui/src/main.rs" `
            "crates/sairplay-msa-solo/src/windows_audio_worker.rs" `
            ".github/workflows/windows.yml"

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "promotion produced no staged changes" }

          git commit -m "refactor: promote validated MSA core fixes into source"
          if ($LASTEXITCODE -ne 0) { throw "source-alignment commit failed" }

          git push origin HEAD:dev/msa-core-architecture
          if ($LASTEXITCODE -ne 0) { throw "source-alignment push failed" }
