name: Cleanup temporary MSA Core workflows

on:
  push:
    branches: [dev/msa-core-architecture]
    paths:
      - ".github/workflows/cleanup-temp-workflows.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary patch workflows and trigger file
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-realtime-resume-rewarm.yml
          rm -f .github/workflows/patch-realtime-resume-rewarm-v2.yml
          rm -f .github/workflows/patch-realtime-resume-rewarm-v3.yml
          rm -f .github/workflows/patch-realtime-resume-rewarm-v4.yml
          rm -f .github/workflows/fix-realtime-rewarm-typo.yml
          rm -f .github/msa-core-ci-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No temporary files to remove."
            exit 0
          fi
          git commit -m "ci: remove temporary realtime patch workflows"
          git push origin HEAD:dev/msa-core-architecture
