name: Patch realtime resume rewarm v4

on:
  push:
    branches: [dev/msa-core-architecture]
    paths:
      - ".github/workflows/patch-realtime-resume-rewarm-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch committed MSA Core source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = ""
          [System.IO.File]::WriteAllBytes("patch-rewarm.py", [Convert]::FromBase64String($b64))
          python patch-rewarm.py
          if ($LASTEXITCODE -ne 0) { throw "patch script failed" }
          git diff --check -- crates/sairplay-msa-solo/src/windows_audio_worker.rs
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git diff -- crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git commit -m "fix: rewarm realtime splice on long-idle source resume"
          if ($LASTEXITCODE -ne 0) { throw "source fix commit failed" }
          git push origin HEAD:dev/msa-core-architecture
          if ($LASTEXITCODE -ne 0) { throw "source fix push failed" }
