name: MiTV HappyCast RAOP

on:
  push:
    branches: [compat/mitv-happycast-raop-diag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply isolated MiTV repository patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/apply_mitv_active_feedback.py --repo .
          git diff --check
          $changed = git diff --name-only
          $changed | Write-Host
          if ($changed -contains "crates/sairplay-msa-solo/src/windows_raop_worker_base.rs") {
            throw "MiTV experiment must not touch the hardware-locked SOtM base worker"
          }

      - name: Build pinned OpenSSL x64 prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = "ac74d79efc7a702386fcf00d4b7e0a785721a3ed"
          $src = "target/vendor/libopenssl-x64"
          $stage = "target/vendor/libopenssl-x64-stage"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          git clone --filter=blob:none https://github.com/Philippe44/libopenssl.git $src
          git -C $src checkout $pin
          git -C $src submodule update --init openssl
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "Visual Studio x64 C++ toolchain not found" }
          $vcvars64 = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $openssl = (Resolve-Path "$src/openssl").Path
          $cmd = "call `"$vcvars64`" && cd /d `"$openssl`" && perl Configure shared VC-WIN64A && nmake"
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Pinned OpenSSL x64 build failed" }
          New-Item -ItemType Directory -Force -Path "$stage/include" | Out-Null
          Copy-Item "$openssl/include/openssl" "$stage/include/openssl" -Recurse -Force
          Copy-Item "$openssl/libcrypto-1_1-x64.dll" $stage -Force
          Copy-Item "$openssl/libssl-1_1-x64.dll" $stage -Force
          Copy-Item "$openssl/libcrypto.lib" $stage -Force
          Copy-Item "$openssl/libssl.lib" $stage -Force

      - name: Build pinned ALAC wrapper x64 prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = "3234c96680fbe9f45047936a14df10edca822e5e"
          $src = "target/vendor/libcodecs-x64"
          $stage = "target/vendor/libcodecs-x64-stage"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          git clone --filter=blob:none https://github.com/Philippe44/libcodecs.git $src
          git -C $src checkout $pin
          git -C $src submodule update --init alac
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $msbuild -or -not $vs) { throw "Visual Studio build tools not found" }
          $vcvars64 = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $stageAbs = (Resolve-Path $stage).Path + "\"
          & $msbuild "$src/alac.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$stageAbs" /p:TargetName=libalac
          if ($LASTEXITCODE -ne 0) { throw "Pinned ALAC build failed" }
          $alacInclude = (Resolve-Path "$src/alac/codec").Path
          $wrapper = (Resolve-Path "$src/addons/alac_wrapper.cpp").Path
          $wrapperObj = Join-Path (Resolve-Path $stage).Path "alac_wrapper.obj"
          $wrapperLib = Join-Path (Resolve-Path $stage).Path "libalac-wrapper.lib"
          $cmd = "call `"$vcvars64`" && cl.exe /nologo /c /O2 /MD /EHsc /I`"$alacInclude`" /Fo`"$wrapperObj`" `"$wrapper`" && lib.exe /nologo /OUT:`"$wrapperLib`" `"$wrapperObj`""
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Pinned ALAC wrapper build failed" }
          New-Item -ItemType Directory -Force -Path "$stage/include/alac" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/include/addons" | Out-Null
          Copy-Item "$src/alac/codec/ALAC*.h" "$stage/include/alac" -Force
          Copy-Item "$src/addons/alac_wrapper.h" "$stage/include/addons/alac_wrapper.h" -Force

      - name: Build pinned pthreads4w static x64 prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = "2ae750783281db5b5cd867649880b3b951ced781"
          $src = "target/vendor/libpthreads4w-x64"
          $build = "target/vendor/libpthreads4w-x64-build"
          $stage = "target/vendor/libpthreads4w-x64-stage"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          if (Test-Path $build) { Remove-Item -Recurse -Force $build }
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          git clone --filter=blob:none https://github.com/philippe44/libpthreads4w.git $src
          git -C $src checkout $pin
          $cmakeHelp = cmake --help | Out-String
          $vsGenerator = [regex]::Matches($cmakeHelp, '(?m)^\*?\s*(Visual Studio \d+ \d{4})') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique | Sort-Object { [int]([regex]::Match($_, 'Visual Studio (\d+)').Groups[1].Value) } -Descending | Select-Object -First 1
          if (-not $vsGenerator) { throw "No Visual Studio CMake generator found" }
          cmake -S $src -B $build -G $vsGenerator -A x64 -DBUILD_TESTING=OFF -DPTHREADS4W_BUILD_C=ON -DPTHREADS4W_BUILD_CE=OFF -DPTHREADS4W_BUILD_SE=OFF
          if ($LASTEXITCODE -ne 0) { throw "pthreads4w configure failed" }
          cmake --build $build --config Release --target pthreadVC-static
          if ($LASTEXITCODE -ne 0) { throw "pthreads4w build failed" }
          $staticLib = Get-ChildItem $build -Recurse -File -Filter "libpthread*.lib" | Select-Object -First 1
          if (-not $staticLib) { throw "pthreads4w static library missing" }
          New-Item -ItemType Directory -Force -Path "$stage/include" | Out-Null
          Copy-Item $staticLib.FullName "$stage/libpthread-static.lib" -Force
          Copy-Item "$src/pthread.h" "$stage/include/pthread.h" -Force
          Copy-Item "$src/_ptw32.h" "$stage/include/_ptw32.h" -Force
          Copy-Item "$src/sched.h" "$stage/include/sched.h" -Force
          Copy-Item "$src/semaphore.h" "$stage/include/semaphore.h" -Force

      - name: Build pinned libraop with MiTV experiment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = "81c2182649da8645ac2a58b78e9f370c79a4165b"
          $dmapPin = "2f8ee61e2427a177beea919d72dde8931084fe51"
          $src = "target/vendor/libraop-client-x64"
          $stage = "target/vendor/libraop-client-x64-stage"
          $obj = "$stage/obj"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          git clone --filter=blob:none https://github.com/philippe44/libraop.git $src
          git -C $src checkout $pin
          git -C $src submodule update --init crosstools dmap-parser
          python scripts/patch_pinned_raop_wire_diag.py $src
          python scripts/apply_mitv_active_feedback.py --libraop $src
          $dmapHead = (git -C "$src/dmap-parser" rev-parse HEAD).Trim()
          if ($dmapHead -ne $dmapPin) { throw "Pinned dmap-parser mismatch: $dmapHead" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "Visual Studio x64 C++ toolchain not found" }
          $vcvars64 = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $srcAbs = (Resolve-Path $src).Path
          $stageAbs = (New-Item -ItemType Directory -Force -Path $stage).FullName
          $objAbs = (New-Item -ItemType Directory -Force -Path $obj).FullName
          $opensslInclude = (Resolve-Path "target/vendor/libopenssl-x64-stage/include").Path
          $pthreadInclude = (Resolve-Path "target/vendor/libpthreads4w-x64-stage/include").Path
          $alacWrapperInclude = (Resolve-Path "target/vendor/libcodecs-x64-stage/include/addons").Path
          $includes = @((Join-Path $srcAbs "src"),(Join-Path $srcAbs "crosstools/src"),(Join-Path $srcAbs "dmap-parser"),$opensslInclude,$pthreadInclude,$alacWrapperInclude)
          $includeArgs = ($includes | ForEach-Object { "/I`"$_`"" }) -join " "
          $sources = @(
            (Join-Path $srcAbs "src/raop_client.c"),(Join-Path $srcAbs "src/rtsp_client.c"),(Join-Path $srcAbs "src/aes.c"),(Join-Path $srcAbs "src/aes_ctr.c"),(Join-Path $srcAbs "src/alac.c"),(Join-Path $srcAbs "dmap-parser/dmap_parser.c"),(Join-Path $srcAbs "crosstools/src/cross_log.c"),(Join-Path $srcAbs "crosstools/src/cross_net.c"),(Join-Path $srcAbs "crosstools/src/cross_ssl.c"),(Join-Path $srcAbs "crosstools/src/cross_util.c"),(Join-Path $srcAbs "crosstools/src/platform.c")
          )
          $objects = @()
          foreach ($source in $sources) {
            $objPath = Join-Path $objAbs (([IO.Path]::GetFileNameWithoutExtension($source)) + ".obj")
            $cmd = "call `"$vcvars64`" && cl.exe /nologo /c /O2 /MD /std:clatest /DNDEBUG /DSSL_STATIC_LIB /DWIN32 /D_CRT_SECURE_NO_WARNINGS /D_WINSOCK_DEPRECATED_NO_WARNINGS /D_CRT_NONSTDC_NO_DEPRECATE /DOPENSSL_SUPPRESS_DEPRECATED $includeArgs /Fo`"$objPath`" `"$source`""
            & cmd.exe /d /s /c $cmd
            if ($LASTEXITCODE -ne 0) { throw "Pinned libraop compile failed: $source" }
            $objects += $objPath
          }
          $lib = Join-Path $stageAbs "libraop-client-x64.lib"
          $objectArgs = ($objects | ForEach-Object { "`"$_`"" }) -join " "
          $cmd = "call `"$vcvars64`" && lib.exe /nologo /OUT:`"$lib`" $objectArgs"
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Pinned libraop archive failed" }
          New-Item -ItemType Directory -Force -Path "$stage/include" | Out-Null
          Copy-Item "$src/src/raop_client.h" "$stage/include/raop_client.h" -Force
          Copy-Item "$src/src/rtsp_client.h" "$stage/include/rtsp_client.h" -Force
          Copy-Item "$src/crosstools/src/platform.h" "$stage/include/platform.h" -Force
          Copy-Item "$src/crosstools/src/cross_net.h" "$stage/include/cross_net.h" -Force
          Copy-Item "$src/crosstools/src/cross_ssl.h" "$stage/include/cross_ssl.h" -Force
          Copy-Item "$src/crosstools/src/cross_log.h" "$stage/include/cross_log.h" -Force
          Copy-Item "$src/crosstools/src/cross_util.h" "$stage/include/cross_util.h" -Force

      - name: Build in-process RAOP bridge x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          $vcvars64 = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $libraop = (Resolve-Path "target/vendor/libraop-client-x64-stage").Path
          $openssl = (Resolve-Path "target/vendor/libopenssl-x64-stage").Path
          $pthread = (Resolve-Path "target/vendor/libpthreads4w-x64-stage").Path
          $alac = (Resolve-Path "target/vendor/libcodecs-x64-stage").Path
          $stage = "target/vendor/sairplay-raop-x64-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          $stageAbs = (New-Item -ItemType Directory -Force -Path $stage).FullName
          $bridge = (Resolve-Path "native/raop-static/raop_bridge.c").Path
          $bridgeInclude = (Resolve-Path "native/raop-static").Path
          $bridgeObj = Join-Path $stageAbs "raop_bridge.obj"
          $logGlobals = Join-Path $stageAbs "raop_log_globals.c"
          $logGlobalsObj = Join-Path $stageAbs "raop_log_globals.obj"
          $bridgeDll = Join-Path $stageAbs "sairplay-raop.dll"
          $includeArgs = @("/I`"$bridgeInclude`"","/I`"$libraop/include`"","/I`"$pthread/include`"","/I`"$alac/include/addons`"","/I`"$openssl/include`"") -join " "
          Set-Content -Path $logGlobals -Encoding ascii -Value @('#include "cross_log.h"','log_level raop_loglevel = lWARN;','log_level util_loglevel = lWARN;')
          $compile = "call `"$vcvars64`" && cl.exe /nologo /c /O2 /MD /std:clatest /DNDEBUG /DWIN32 /DSSL_STATIC_LIB /D_CRT_SECURE_NO_WARNINGS /D_WINSOCK_DEPRECATED_NO_WARNINGS /D_CRT_NONSTDC_NO_DEPRECATE /DOPENSSL_SUPPRESS_DEPRECATED $includeArgs /Fo`"$bridgeObj`" `"$bridge`""
          & cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) { throw "RAOP bridge compile failed" }
          $compileGlobals = "call `"$vcvars64`" && cl.exe /nologo /c /O2 /MD /std:clatest /DNDEBUG /DWIN32 $includeArgs /Fo`"$logGlobalsObj`" `"$logGlobals`""
          & cmd.exe /d /s /c $compileGlobals
          if ($LASTEXITCODE -ne 0) { throw "RAOP log globals compile failed" }
          $exports = @("sr_raop_open","sr_raop_close","sr_raop_healthy","sr_raop_keepalive","sr_raop_commit_start","sr_raop_start_after_flush","sr_raop_flush","sr_raop_standby","sr_raop_pause","sr_raop_play","sr_raop_stop","sr_raop_set_volume","sr_raop_set_progress","sr_raop_set_metadata","sr_raop_set_artwork","sr_raop_write_packet","sr_raop_head_audible_ms","sr_raop_diag_snapshot") | ForEach-Object { "/EXPORT:$_" }
          $exportArgs = $exports -join " "
          $link = "call `"$vcvars64`" && link.exe /nologo /DLL /OUT:`"$bridgeDll`" `"$bridgeObj`" `"$logGlobalsObj`" `"$libraop/libraop-client-x64.lib`" `"$alac/libalac-wrapper.lib`" `"$alac/libalac.lib`" `"$pthread/libpthread-static.lib`" `"$openssl/libcrypto.lib`" `"$openssl/libssl.lib`" ws2_32.lib wsock32.lib iphlpapi.lib $exportArgs"
          & cmd.exe /d /s /c $link
          if ($LASTEXITCODE -ne 0) { throw "RAOP bridge link failed" }

      - name: Test MSA SOLO
        run: cargo test -p sairplay-msa-solo --all-targets

      - name: Build GUI
        run: cargo build --release -p sairplay-gui

      - name: Package MiTV HappyCast test artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target/release/SAirplay2-MiTV"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target/release/sairplay-gui.exe" "$out/sairplay-gui.exe" -Force
          Copy-Item "target/vendor/sairplay-raop-x64-stage/sairplay-raop.dll" "$out/sairplay-raop.dll" -Force
          Copy-Item "target/vendor/libopenssl-x64-stage/libcrypto-1_1-x64.dll" "$out/libcrypto-1_1-x64.dll" -Force
          Copy-Item "target/vendor/libopenssl-x64-stage/libssl-1_1-x64.dll" "$out/libssl-1_1-x64.dll" -Force
          Get-FileHash "$out/sairplay-gui.exe" -Algorithm SHA256
          Get-FileHash "$out/sairplay-raop.dll" -Algorithm SHA256

      - name: Upload MiTV HappyCast Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAirplay2-MiTV-HappyCast-Feedback-Windows
          path: target/release/SAirplay2-MiTV/*
