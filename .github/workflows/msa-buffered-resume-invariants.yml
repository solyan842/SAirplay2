name: MSA Buffered Resume Invariants

on:
  push:
    branches: ["dev/msa-core-architecture"]
    paths:
      - "crates/sairplay-msa-solo/**"
      - "scripts/verify-buffered-resume-invariants.ps1"
      - ".github/workflows/msa-buffered-resume-invariants.yml"
  pull_request:
    paths:
      - "crates/sairplay-msa-solo/**"
      - "scripts/verify-buffered-resume-invariants.ps1"
      - ".github/workflows/msa-buffered-resume-invariants.yml"

concurrency:
  group: msa-buffered-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify field-proven buffered resume invariants
        shell: pwsh
        run: ./scripts/verify-buffered-resume-invariants.ps1
