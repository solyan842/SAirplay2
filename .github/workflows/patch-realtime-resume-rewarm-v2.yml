name: Patch realtime resume rewarm v2

on:
  push:
    branches: [dev/msa-core-architecture]
    paths:
      - ".github/workflows/patch-realtime-resume-rewarm-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch committed MSA Core source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/sairplay-msa-solo/src/windows_audio_worker.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          old = '''fn buffered_capture_idle_should_park(
              source_present: bool,
              idle_for: Duration,
              is_buffered: bool,
              state: Ap2State,
              content_paused: bool,
              content_stopped: bool,
          ) -> bool {
              source_present
                  && is_buffered
                  && state == Ap2State::Streaming
                  && !content_paused
                  && !content_stopped
                  && idle_for >= BUFFERED_CAPTURE_IDLE_PARK_INTERVAL
          }
          '''
          new = old + '''
          fn realtime_capture_resume_should_rewarm(
              source_present: bool,
              capture_edge: bool,
              non_silent_edge: bool,
              idle_for: Duration,
              is_buffered: bool,
              state: Ap2State,
              splice_timeline: bool,
          ) -> bool {
              source_present
                  && capture_edge
                  && non_silent_edge
                  && idle_for >= STARVATION_RECOVERY_INTERVAL
                  && !is_buffered
                  && state == Ap2State::Streaming
                  && splice_timeline
          }
          '''
          replace_once(old, new, "helper insertion")

          old = '''                        let capture_generation =
                              pcm_hub_thread.capture_frame_generation();
                          if capture_generation != capture_frame_seen {
                              capture_frame_seen = capture_generation;
                              last_capture_frame_at = Instant::now();
                          }
          '''
          new = '''                        let capture_generation =
                              pcm_hub_thread.capture_frame_generation();
                          let capture_edge = capture_generation != capture_frame_seen;
                          let capture_idle_before_edge = last_capture_frame_at.elapsed();
                          if capture_edge {
                              capture_frame_seen = capture_generation;
                              last_capture_frame_at = Instant::now();
                          }
          '''
          replace_once(old, new, "capture edge")

          old = '''                        if non_silent_edge {
                              non_silent_seen = non_silent_generation;
                          }

                          // A capture-idle park is resumed only after the producer
          '''
          new = '''                        if non_silent_edge {
                              non_silent_seen = non_silent_generation;
                          }

                          // Windows loopback has no explicit player PAUSE event. A long
                          // realtime capture gap leaves MSA's splice wire alive on silence.
                          // When fresh non-silent PCM returns while that wire head is in its
                          // low phase, re-run MSA's own input-gap recovery before content is
                          // consumed. It is a no-op when the effective head is already warm.
                          let realtime_resume_rewarmed = {
                              let mut guard = match engine_thread.lock() {
                                  Ok(v) => v,
                                  Err(_) => {
                                      if let Ok(mut slot) = error_thread.lock() {
                                          *slot = Some("native SOLO engine mutex poisoned".into());
                                      }
                                      running_thread.store(false, Ordering::SeqCst);
                                      return;
                                  }
                              };
                              if realtime_capture_resume_should_rewarm(
                                  pcm_hub_thread.source_present(),
                                  capture_edge,
                                  non_silent_edge,
                                  capture_idle_before_edge,
                                  guard.is_buffered(),
                                  guard.runtime.state,
                                  guard.runtime.splice_timeline,
                              ) {
                                  let now_ntp = match SourceNtp::from_system_time(SystemTime::now()) {
                                      Ok(v) => v,
                                      Err(_) => SourceNtp::ZERO,
                                  };
                                  let now_frame = now_ntp.to_frames(
                                      guard.runtime.media.timeline.sample_rate,
                                  );
                                  match guard.ready.timing_owner.sync_timing() {
                                      Ok(timing) => {
                                          let engine = &mut *guard;
                                          engine.runtime.recover_input_gap(
                                              now_frame,
                                              &mut engine.ready.media.io,
                                              timing,
                                          )
                                      }
                                      Err(_) => false,
                                  }
                              } else {
                                  false
                              }
                          };
                          if realtime_resume_rewarmed {
                              if let Ok(mut events) = events_thread.lock() {
                                  events.push(format!(
                                      "MSA INPUT REALTIME source-resume rewarm: capture idle {}ms; MSA timeline silence queued before fresh PCM.",
                                      capture_idle_before_edge.as_millis()
                                  ));
                              }
                          }

                          // A capture-idle park is resumed only after the producer
          '''
          replace_once(old, new, "resume rewarm")

          old = '''    #[test]
              fn realtime_starvation_waits_for_first_source_packet() {
                  let source_present = false;
                  let ring_has_packet = false;
                  assert!(!(source_present && !ring_has_packet));

                  let source_present = true;
                  assert!(source_present && !ring_has_packet);
              }
          '''
          new = old + '''
              #[test]
              fn realtime_long_idle_resume_rewarms_only_splice_lane() {
                  assert!(!realtime_capture_resume_should_rewarm(
                      true,
                      true,
                      true,
                      STARVATION_RECOVERY_INTERVAL - Duration::from_millis(1),
                      false,
                      Ap2State::Streaming,
                      true,
                  ));
                  assert!(realtime_capture_resume_should_rewarm(
                      true,
                      true,
                      true,
                      STARVATION_RECOVERY_INTERVAL,
                      false,
                      Ap2State::Streaming,
                      true,
                  ));
                  assert!(!realtime_capture_resume_should_rewarm(
                      true,
                      true,
                      true,
                      STARVATION_RECOVERY_INTERVAL,
                      true,
                      Ap2State::Streaming,
                      true,
                  ));
                  assert!(!realtime_capture_resume_should_rewarm(
                      true,
                      true,
                      false,
                      STARVATION_RECOVERY_INTERVAL,
                      false,
                      Ap2State::Streaming,
                      true,
                  ));
              }
          '''
          replace_once(old, new, "targeted unit test")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check -- crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git diff -- crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git commit -m "fix: rewarm realtime splice on long-idle source resume"
          git push origin HEAD:dev/msa-core-architecture
