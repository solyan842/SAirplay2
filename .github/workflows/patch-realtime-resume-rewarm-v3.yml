name: Patch realtime resume rewarm v3

on:
  push:
    branches: [dev/msa-core-architecture]
    paths:
      - ".github/workflows/patch-realtime-resume-rewarm-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch committed MSA Core source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/sairplay-msa-solo/src/windows_audio_worker.rs")
          text = path.read_text(encoding="utf-8").replace("\r\n", "\n")

          marker = "\n#[derive(Debug)]\n"
          if text.count(marker) != 1:
              raise SystemExit(f"derive marker count={text.count(marker)}")
          helper = '''
          fn realtime_capture_resume_should_rewarm(
              source_present: bool,
              capture_edge: bool,
              non_silent_edge: bool,
              idle_for: Duration,
              is_buffered: bool,
              state: Ap2State,
              splice_timeline: bool,
          ) -> bool {
              source_present
                  && capture_edge
                  && non_silent_edge
                  && idle_for >= STARVATION_RECOVERY_INTERVAL
                  && !is_buffered
                  && state == Ap2State::Streaming
                  && splice_timeline
          }
          '''.strip()
          if "fn realtime_capture_resume_should_rewarm(" in text:
              raise SystemExit("helper already present")
          text = text.replace(marker, "\n\n" + helper + "\n\n#[derive(Debug)]\n", 1)

          capture = re.compile(
              r'(?m)^(?P<i>[ \t]*)let capture_generation =\n'
              r'(?P=i)    pcm_hub_thread\.capture_frame_generation\(\);\n'
              r'(?P=i)if capture_generation != capture_frame_seen \{\n'
              r'(?P=i)    capture_frame_seen = capture_generation;\n'
              r'(?P=i)    last_capture_frame_at = Instant::now\(\);\n'
              r'(?P=i)\}'
          )
          m = capture.search(text)
          if not m:
              raise SystemExit("capture generation block not found")
          i = m.group("i")
          repl = (
              f"{i}let capture_generation =\n"
              f"{i}    pcm_hub_thread.capture_frame_generation();\n"
              f"{i}let capture_edge = capture_generation != capture_frame_seen;\n"
              f"{i}let capture_idle_before_edge = last_capture_frame_at.elapsed();\n"
              f"{i}if capture_edge {{\n"
              f"{i}    capture_frame_seen = capture_generation;\n"
              f"{i}    last_capture_frame_at = Instant::now();\n"
              f"{i}}}"
          )
          text = text[:m.start()] + repl + text[m.end():]

          edge = re.compile(
              r'(?m)^(?P<i>[ \t]*)if non_silent_edge \{\n'
              r'(?P=i)    non_silent_seen = non_silent_generation;\n'
              r'(?P=i)\}\n'
          )
          m = edge.search(text)
          if not m:
              raise SystemExit("non-silent edge block not found")
          i = m.group("i")
          rewarm = f'''{m.group(0)}
{i}// Windows has no explicit player PAUSE event. During a long realtime
{i}// capture gap MSA keeps the splice wire alive with silence. If fresh
{i}// non-silent PCM returns while that wire head is in its low phase,
{i}// re-run MSA's own input-gap recovery before consuming content. When
{i}// the effective head is already warm this is deliberately a no-op.
{i}let realtime_resume_rewarmed = {{
{i}    let mut guard = match engine_thread.lock() {{
{i}        Ok(v) => v,
{i}        Err(_) => {{
{i}            if let Ok(mut slot) = error_thread.lock() {{
{i}                *slot = Some("native SOLO engine mutex poisoned".into());
{i}            }}
{i}            running_thread.store(false, Ordering::SeqCst);
{i}            return;
{i}        }}
{i}    }};
{i}    if realtime_capture_resume_should_rewarm(
{i}        pcm_hub_thread.source_present(),
{i}        capture_edge,
{i}        non_silent_edge,
{i}        capture_idle_before_edge,
{i}        guard.is_buffered(),
{i}        guard.runtime.state,
{i}        guard.runtime.splice_timeline,
{i}    ) {{
{i}        let now_ntp = match SourceNtp::from_system_time(SystemTime::now()) {{
{i}            Ok(v) => v,
{i}            Err(_) => SourceNtp::ZERO,
{i}        }};
{i}        let now_frame = now_ntp.to_frames(guard.runtime.media.timeline.sample_rate);
{i}        match guard.ready.timing_owner.sync_timing() {{
{i}            Ok(timing) => {{
{i}                let engine = &mut *guard;
{i}                engine.runtime.recover_input_gap(
{i}                    now_frame,
{i}                    &mut engine.ready.media.io,
{i}                    timing,
{i}                )
{i}            }}
{i}            Err(_) => false,
{i}        }}
{i}    }} else {{
{i}        false
{i}    }}
{i}}};
{i}if realtime_resume_rewarmed {{
{i}    if let Ok(mut events) = events_thread.lock() {{
{i}        events.push(format!(
{i}            "MSA INPUT REALTIME source-resume rewarm: capture idle {{}}ms; MSA timeline silence queued before fresh PCM.",
{i}            capture_idle_before_edge.as_millis()
{i}        ));
{i}    }}
{i}}}
'''
          text = text[:m.start()] + rewarm + text[m.end():]

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check -- crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git diff -- crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sairplay-msa-solo/src/windows_audio_worker.rs
          git commit -m "fix: rewarm realtime splice on long-idle source resume"
          git push origin HEAD:dev/msa-core-architecture
