name: Windows

on:
  push:
    branches: [main, "dev/**", "rewrite/**"]
  pull_request:

concurrency:
  group: sairplay2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test invariants
        run: cargo test --workspace --all-targets
      - name: Build GUI
        run: cargo build --release -p sairplay-gui
      - name: Upload Windows GUI
        uses: actions/upload-artifact@v4
        with:
          name: SAirplay2-v0.1.0-Windows
          path: target/release/sairplay-gui.exe
