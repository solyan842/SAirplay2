name: Windows

on:
  push:
    branches: [main, "dev/**", "rewrite/**"]
  pull_request:

concurrency:
  group: sairplay2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test invariants
        run: cargo test --workspace --all-targets
      - name: Build GUI
        run: cargo build --release -p sairplay-gui
      - name: Build source-aligned ALAC24 bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libraopPin = "81c2182649da8645ac2a58b78e9f370c79a4165b"
          $src = "target/vendor/airplay-cli-libraop"
          $build = "target/alac24-build"

          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          if (Test-Path $build) { Remove-Item -Recurse -Force $build }

          git clone --filter=blob:none https://github.com/philippe44/libraop.git $src
          git -C $src checkout $libraopPin
          git -C $src submodule update --init --recursive libcodecs

          $alac = (Resolve-Path "$src/libcodecs/alac/codec").Path

          # windows-latest may move to a newer Visual Studio image before the
          # workflow is updated. Resolve the newest VS CMake generator exposed
          # by the runner instead of pinning a marketing version.
          $cmakeHelp = cmake --help | Out-String
          $vsGenerators = [regex]::Matches(
            $cmakeHelp,
            '(?m)^\*?\s*(Visual Studio \d+ \d{4})'
          ) | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          $vsGenerator = $vsGenerators |
            Sort-Object { [int]([regex]::Match($_, 'Visual Studio (\d+)').Groups[1].Value) } -Descending |
            Select-Object -First 1
          if (-not $vsGenerator) { throw "No Visual Studio CMake generator found" }
          Write-Host "Using CMake generator: $vsGenerator"

          cmake -S "native/alac24" -B $build -G $vsGenerator -A x64 "-DALAC_SOURCE=$alac"
          if ($LASTEXITCODE -ne 0) { throw "ALAC24 CMake configure failed" }

          cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw "ALAC24 build failed" }

          $dll = "$build/Release/sairplay-alac24.dll"
          if (-not (Test-Path $dll)) { throw "sairplay-alac24.dll missing" }
          Get-FileHash $dll -Algorithm SHA256

      - name: Build current libraop helper from source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = "dadcfcaa26d988cdd3e3501ddf8286c224f1b494"
          $src = "target/vendor/libraop"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          git clone --filter=blob:none https://github.com/philippe44/libraop.git $src
          git -C $src checkout $pin
          git -C $src submodule update --init --recursive
          Copy-Item "$env:GITHUB_WORKSPACE/native/cliraop-runtime-volume.c" "$src/src/cliraop.c" -Force

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }

          & $msbuild "$src/libraop.sln" /m /p:Configuration=Release /p:Platform=x86
          if ($LASTEXITCODE -ne 0) { throw "Current libraop source build failed" }
          if (-not (Test-Path "$src/bin/cliraop.exe")) { throw "Source-built cliraop.exe missing" }

          $help = (& "$src/bin/cliraop.exe" --help | Out-String)
          $help | Write-Host
          if ($help -notmatch '\[-V <runtime volume file>\]') {
            throw "Source-built cliraop.exe is missing runtime-volume support"
          }
          # Upstream cliraop returns -1 after printing usage. The binary has
          # already been source-built successfully; normalize this documented
          # help exit so it cannot fail the packaging job.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cliraop --help returned $LASTEXITCODE (upstream usage exit); continuing."
            $global:LASTEXITCODE = 0
          }
          Get-FileHash "$src/bin/cliraop.exe" -Algorithm SHA256

      - name: Bundle current libraop legacy transport
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = "dadcfcaa26d988cdd3e3501ddf8286c224f1b494"
          $base = "https://raw.githubusercontent.com/philippe44/libraop/$pin"
          $src = "target/vendor/libraop"
          $out = "target/release/SAirplay2"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "target/release/sairplay-gui.exe" "$out/sairplay-gui.exe"
          Copy-Item "target/alac24-build/Release/sairplay-alac24.dll" "$out/sairplay-alac24.dll"
          Copy-Item "$src/bin/cliraop.exe" "$out/cliraop.exe"
          Invoke-WebRequest "$base/bin/libcrypto-1_1.dll" -OutFile "$out/libcrypto-1_1.dll"
          Invoke-WebRequest "$base/bin/libssl-1_1.dll" -OutFile "$out/libssl-1_1.dll"
          Invoke-WebRequest "$base/README.md" -OutFile "$out/LIBRAOP-README.md"
          Copy-Item "docs/LEGACY-TRANSPORT.md" "$out/LEGACY-TRANSPORT.md"
          Get-FileHash "$out/cliraop.exe" -Algorithm SHA256
          Get-ChildItem $out
      - name: Upload Windows GUI
        uses: actions/upload-artifact@v4
        with:
          name: SAirplay2-v0.1.0-Windows
          path: target/release/SAirplay2/*
